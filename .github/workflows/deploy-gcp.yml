name: CI/CD — Deploy to GCP TEST (dev branch)

on:
  push:
    branches:
      - dev

jobs:
  ci-gcp:
    name: Build & Test (GCP)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false --passWithNoTests
        env:
          CI: true

  deploy-gcp:
    name: Deploy to GCP TEST (GCS)
    runs-on: ubuntu-latest
    needs: ci-gcp
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build
        env:
          CI: false
          REACT_APP_ENV: test

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Sync build to GCS bucket
        run: gsutil -m rsync -r -d build/ gs://${{ secrets.GCS_BUCKET }}

      - name: Print GCP TEST info
        run: |
          echo 'GCP deployment complete - files uploaded to gs://react-cicd-demo-trivikram-gcp'
          echo 'Project: react-cicd-demo-492510'
